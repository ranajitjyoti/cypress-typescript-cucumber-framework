name: Auto Daily Push

on:
  schedule:
    - cron: '32 1 * * *'  # Runs every day at 1:32 AM UTC
  workflow_dispatch:        # Allows manual trigger from GitHub

jobs:
  auto-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Make a change
        run: echo "cypress code changes $(date +'%d-%m-%Y')" > auto-push-log.txt

      - name: Commit and push
        run: |
          git config user.name "ranajitjyoti"
          git config user.email "ranajitjyoti@users.noreply.github.com"
          git add .
          git commit -m "cypress code changes $(date +'%d-%m-%Y')" || echo "Nothing to commit"
          git push origin master
